name: Guba CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: \( {{ github.workflow }}- \){{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check
        run: |
          python -m py_compile guba.py
          echo "Syntax OK"

      - name: Structure check
        run: |
          python -c "
          import ast
          src = open('guba.py', encoding='utf-8').read()
          ast.parse(src)
          assert 'def main' in src
          print('Structure OK')
          "
